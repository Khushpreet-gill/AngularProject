<div class="help-desk-container">
    <h2>Help Desk</h2>
  
    <form (ngSubmit)="submitForm()">
      <div class="form-group">
        <label>Name:</label>
        <input type="text" [(ngModel)]="formData.name" name="name" required />
  
        <label class="prn-label">PRN No.:</label>
        <input type="text" [(ngModel)]="formData.prn" name="prn" required />
      </div>
  
      <div class="form-group">
        <label>Department:</label>
        <select [(ngModel)]="formData.department" name="department">
          <option value="IT">IT</option>
          <option value="CSE">CSE</option>
          <option value="ECE">ECE</option>
        </select>
  
        <label class="email-label">Email:</label>
        <input type="email" [(ngModel)]="formData.email" name="email" required />
      </div>
  
      <div class="form-group">
        <label>Title of Enquiry:</label>
        <input type="text" [(ngModel)]="formData.enquiry" name="enquiry" required />
      </div>
  
      <div class="form-group">
        <label>Description:</label>
        <textarea [(ngModel)]="formData.description" name="description" rows="4" required></textarea>
      </div>
  
      <div class="button-group">
        <button type="submit" class="submit-btn">Submit</button>
        <button type="button" class="cancel-btn" (click)="cancelForm()">Cancel</button>
      </div>
    </form>
  </div>
